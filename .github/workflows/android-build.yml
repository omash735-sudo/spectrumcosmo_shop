name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./spectrumcosmo

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js app for mobile
        run: |
          if [ -d "src/app/api" ]; then
            mv src/app/api /tmp/api_backup
          fi
          if [ -d "src/app/admin" ]; then
            mv src/app/admin /tmp/admin_backup
          fi
          
          BUILD_TARGET=mobile NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }} npm run build
          
          if [ -d "/tmp/api_backup" ]; then
            mv /tmp/api_backup src/app/api
          fi
          if [ -d "/tmp/admin_backup" ]; then
            mv /tmp/admin_backup src/app/admin
          fi
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: npx cap add android || npx cap sync android

      - name: Sync Capacitor
        run: |
          npx cap sync android
          npx cap copy android

      - name: Generate app icons
        run: |
          npx capacitor-assets generate --icon --splash

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: spectrumcosmo/android/app/build/outputs/apk/debug/*.apk
