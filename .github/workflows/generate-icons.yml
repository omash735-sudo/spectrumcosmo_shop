name: Generate App Icons

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./spectrumcosmo
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm install
        
      - name: Install capacitor-assets
        run: npm install -D @capacitor/assets
        
      - name: Download logo
        run: |
          curl -o logo.png "https://res.cloudinary.com/dfsvnaslv/image/upload/v1787426888/spectrumcosmo_mark_black_1024px_cwui04.png"
          
      - name: Generate icons and splash
        run: npx capacitor-assets generate --icon --splash
        
      - name: Upload generated assets
        uses: actions/upload-artifact@v4
        with:
          name: app-assets
          path: |
            spectrumcosmo/android/app/src/main/res/mipmap-*/
            spectrumcosmo/resources/
